[build]
  publish = "."
  functions = "netlify/functions"
  # Only rebuild when something a visitor could actually see has changed.
  #
  # A production deploy costs 15 credits, and the plan grants 1,000 a month. On
  # 26 Aug 2026, 39 deploys spent 585 of them in a single day — and 13 of those
  # deploys were commits to automation/ or .github/ that never touched the
  # website at all. That is 195 credits of building nothing.
  #
  # Netlify's rule: this command exiting 0 SKIPS the build, exiting non-zero
  # runs it. So this asks "did anything outside automation/ and .github/
  # change?" and skips when the answer is no. If CACHED_COMMIT_REF is empty —
  # a cleared cache, a first build — the diff errors, exits non-zero, and the
  # build runs, which is the safe way round.
  #
  # The scheduled workflows already tag their commits [skip netlify]; this
  # catches everything done by hand, which is where the money went.
  #
  # 5 Oct 2026: after a month without a build Netlify's cache had expired, it
  # cloned fresh, and CACHED_COMMIT_REF came through EQUAL to COMMIT_REF — so
  # the diff was empty, the command exited 0, and two real deploys were
  # cancelled as "no content change". The guard in front now says: if there is
  # nothing older to compare against, build.
  ignore = "test \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)automation' ':(exclude).github' ':(exclude)artwork'"

[functions]
  node_bundler = "esbuild"

# Paid PDFs reach buyers only through /api/download (signed, expiring links),
# so that one function carries the files with it.
[functions.download]
  included_files = ["digital/**"]

# Nothing under /digital/ should appear in search results.
[[headers]]
  for = "/digital/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# sw.js removes the old Replit service worker still installed in people's
# browsers on froglogic.co.uk and www.froglogic.co.uk. A browser will only pick
# it up if it actually re-fetches it, so it must never be served from cache.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

# ---- One door per channel ----
# The referrer panel in GoatCounter stayed empty all weekend with referrer
# collection switched on: the Facebook, Instagram and Pinterest apps open links
# in browsers that strip it. These short paths carry the channel in the URL
# instead — ?ref=<channel> is what GoatCounter records as the referrer — so
# "where did they come from" no longer depends on what an app chooses to send.
# Pinterest pins link to /pin, the daily captions say /fb and /ig.
[[redirects]]
  from = "/pin"
  to = "/?ref=pinterest"
  status = 302
# Christmas "send this to the relatives" picture (28 Oct 2026) says froglogic.co.uk/xmas.
[[redirects]]
  from = "/xmas"
  to = "/?ref=xmascard#guides"
  status = 302

[[redirects]]
  from = "/pin/guides"
  to = "/?ref=pinterest#guides"
  status = 302
[[redirects]]
  from = "/pin/frogs"
  to = "/?ref=pinterest#frogs"
  status = 302
[[redirects]]
  from = "/ig"
  to = "/?ref=instagram"
  status = 302
[[redirects]]
  from = "/fb"
  to = "/?ref=facebook"
  status = 302
[[redirects]]
  from = "/etsy"
  to = "/?ref=etsy"
  status = 302

# ---- Old Replit site, laid to rest ----
# Google Search Console (7 Sept 2026) still held ~2,700 URLs from the Replit
# shop that lived on this domain before 24 Aug 2026: /products/<printify id>,
# /products, /policies/terms, /api/sitemap.xml. They all 404 here, and every
# report Google sends about them is noise. A permanent redirect tells Google
# the pages moved rather than broke, so it drops them faster and passes any
# link value to the live page. Nothing on the current site uses these paths.
[[redirects]]
  from = "/downloads/*"
  to = "/#digital"
  status = 301
[[redirects]]
  from = "/products/*"
  to = "/#frogs"
  status = 301
[[redirects]]
  from = "/products"
  to = "/"
  status = 301
[[redirects]]
  from = "/collections/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/policies/terms"
  to = "/terms.html"
  status = 301
[[redirects]]
  from = "/policies/privacy"
  to = "/privacy.html"
  status = 301
[[redirects]]
  from = "/policies/*"
  to = "/returns.html"
  status = 301
[[redirects]]
  from = "/api/sitemap.xml"
  to = "/sitemap.xml"
  status = 301

# ---- Halloween, after it's gone ----
# The Halloween pages are removed on 1 Nov 2026 (retire-halloween.yml). Pins and
# shares still point at them, so each old address goes to the nearest thing
# still on sale instead of a dead page. While a page still exists Netlify
# serves the page and ignores the rule, so these sit harmlessly until the 1st.
[[redirects]]
  from = "/p/do-not-perceive-me-tee"
  to = "/#frogs"
  status = 301
[[redirects]]
  from = "/p/chaos-gremlin-halloween-tee"
  to = "/#frogs"
  status = 301
[[redirects]]
  from = "/p/social-battery-undead-tee"
  to = "/#frogs"
  status = 301
[[redirects]]
  from = "/p/sensory-witch-tee"
  to = "/#frogs"
  status = 301
[[redirects]]
