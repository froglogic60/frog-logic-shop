name: Make a product video
# Product-only video (slow zoom in and out) from one mockup photo in the repo,
# via automation/social/product-video.py (2 Nov 2026). Run by hand.
# Writes automation/social/videos/<name>-<shape>.mp4 and commits [skip netlify].
on:
  workflow_dispatch:
    inputs:
      image:
        description: "Mockup photo path in the repo, e.g. automation/social/xmas-bundle-mockups/bright/bright-uk-mug-front-11oz.jpg"
        required: true
      name:
        description: "Output name, e.g. socially-hibernating-mug-bright"
        required: true
      shapes:
        description: "square (Etsy), vertical (Reels/TikTok), or square,vertical"
        required: false
        default: "square,vertical"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install pillow
      - name: Render
        run: python3 automation/social/product-video.py
        env:
          IMAGE: ${{ inputs.image }}
          NAME: ${{ inputs.name }}
          SHAPES: ${{ inputs.shapes }}
      - name: Commit
        run: |
          git config user.name "frog-logic-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/social/videos/*.mp4
          git commit -m "Product video ${{ inputs.name }} [skip netlify]" || echo "nothing to commit"
          git pull --rebase origin main
          git push
