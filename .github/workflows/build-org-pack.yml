name: Build the Organisation Pack
# Rebuilds digital/Organisation-Pack-{Team,Service,Organisation}.pdf from the
# sheets already in digital/ (automation/pdf/organisation-pack.py) and commits
# them. Run it after any sheet in the pack changes, or when the licence wording
# changes. Costs no deploy credits: the commit is tagged [skip netlify], so the
# site picks the new files up on the next real deploy — and the files are
# served straight from the repo, so a download link works as soon as that
# deploy lands.
#
# Why a workflow and not a local build: the PDFs are binary, and the only
# route into this repo from Claude's side is the GitHub web editor, which is
# text-only. Letting the repo build its own binaries keeps that route open.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install WeasyPrint's system libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libffi-dev
      - name: Install the builder
        run: pip install --quiet weasyprint pikepdf
      - name: Build the three licences
        run: python3 automation/pdf/organisation-pack.py
      - name: Commit the PDFs
        run: |
          git config user.name "frog-logic-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digital/Organisation-Pack-*.pdf
          git status --short
          git commit -m "Organisation Pack PDFs rebuilt [skip netlify]" || echo "nothing to commit"
          git pull --rebase origin main
          git push
