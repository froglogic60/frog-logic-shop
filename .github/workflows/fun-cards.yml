name: Build the fun post cards
# Renders automation/social/fun/<name>.jpg for every entry in fun-queue.json
# (fun-cards.cjs). Run by hand after the queue or the card designs change.
# Commits [skip netlify]: the posts take the images from raw.githubusercontent.com.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install renderer
        working-directory: automation/social
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        working-directory: automation/social
        run: npx playwright install --with-deps chromium
      - name: Build the cards
        working-directory: automation/social
        run: node fun-cards.cjs
      - name: Commit
        run: |
          git config user.name "frog-logic-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/social/fun
          git commit -m "Fun post cards built [skip netlify]" || echo "nothing to commit"
          git pull --rebase origin main
          git push
