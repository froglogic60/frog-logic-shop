name: Christmas bundle products
# Creates the Socially Hibernating hoodie, tee, beanie (US) and hoodie, tee,
# fleece blanket (UK) in the Printify Etsy store, unpublished. Photos and Etsy
# delivery profiles are checked by hand before anything goes live.
# See xmas-bundle.js. Commits xmas-bundle-result.json [skip netlify].
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report only, create nothing"
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the products
        working-directory: automation/social
        run: node xmas-bundle.js
        env:
          PRINTIFY_API_KEY: ${{ secrets.PRINTIFY_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
      - name: Commit the result
        if: always()
        run: |
          git config user.name "frog-logic-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/social/xmas-bundle-result.json || true
          git commit -m "Christmas bundle products [skip netlify]" || echo "nothing to commit"
          git pull --rebase origin main
          git push
