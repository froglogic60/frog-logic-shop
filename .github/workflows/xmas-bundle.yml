name: Christmas bundle products
# Creates the Socially Hibernating hoodie, tee, beanie (US) and hoodie, tee,
# fleece blanket (UK) in the Printify Etsy store, unpublished. Photos and Etsy
# delivery profiles are checked by hand before anything goes live.
# See xmas-bundle.js. Commits xmas-bundle-result.json [skip netlify].
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report only, create nothing"
        type: boolean
        default: true
      reprint:
        description: "Also replace artwork/placement on products already built"
        type: boolean
        default: false
      store:
        description: "Which Printify store: etsy, or site (the website's store, for the one-price sets)"
        type: choice
        options: [etsy, site]
        default: etsy
      colourway:
        description: "original set, or the bright / mono colourway pieces"
        type: choice
        options: [original, bright, mono]
        default: original
      mockups_only:
        description: "Only download mockups of the built products for checking"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the products
        if: ${{ !inputs.mockups_only }}
        working-directory: automation/social
        run: node xmas-bundle.js
        env:
          PRINTIFY_API_KEY: ${{ secrets.PRINTIFY_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          REPRINT: ${{ inputs.reprint && '1' || '0' }}
          STORE: ${{ inputs.store }}
          PRINTIFY_SHOP_ID: ${{ secrets.PRINTIFY_SHOP_ID }}
          COLOURWAY: ${{ inputs.colourway != 'original' && inputs.colourway || '' }}
      - name: Download mockups for checking
        if: ${{ inputs.mockups_only }}
        working-directory: automation/social
        run: node xmas-bundle-mockups.js
        env:
          PRINTIFY_API_KEY: ${{ secrets.PRINTIFY_API_KEY }}
          STORE: ${{ inputs.store }}
          COLOURWAY: ${{ inputs.colourway != 'original' && inputs.colourway || '' }}
      - name: Commit the result
        if: always()
        run: |
          git config user.name "frog-logic-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in automation/social/xmas-bundle-result.json automation/social/xmas-bundle-site-result.json automation/social/xmas-colourway-*-result.json automation/social/xmas-bundle-mockups; do git add "$f" 2>/dev/null || true; done
          git commit -m "Christmas bundle products [skip netlify]" || echo "nothing to commit"
          git pull --rebase origin main
          git push
