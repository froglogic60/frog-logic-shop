name: Build the free-tools promo pictures
# Renders automation/social/promo/ (promo-tools.cjs): Facebook/Instagram posts and
# Pinterest pins for the timetable, card maker and Pond Advent (28 Oct 2026). Run by hand.
# Commits [skip netlify]: the posts take the images from raw.githubusercontent.com.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install renderer
        working-directory: automation/social
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        working-directory: automation/social
        run: npx playwright install --with-deps chromium
      - name: Build the pictures
        working-directory: automation/social
        run: node promo-tools.cjs
      - name: Commit
        run: |
          git config user.name "frog-logic-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/social/promo
          git commit -m "Free-tools promo pictures built [skip netlify]" || echo "nothing to commit"
          git pull --rebase origin main
          git push
