name: Fix the eight Letter-sized printables
# Eight older downloads were exported at US Letter while the shop sells them
# as A4, and their emoji bitmaps were drawn ~a line too high (frogs sitting on
# "CHAPTER" in the Hoppy Thoughts zines, the title frog off the top of the
# page). automation/pdf/fix-letter-pdfs.py moves every emoji back onto its
# line and scales each page onto A4. It skips any file that is already A4, so
# running this twice changes nothing.
# Translation Cards and Affirmation Cards are inside the Organisation Pack, so
# the pack is rebuilt afterwards. Commit is tagged [skip netlify]; run
# "Publish the shop" once afterwards to put the files live.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install WeasyPrint's system libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libffi-dev poppler-utils
      - name: Install the tools
        run: pip install --quiet weasyprint pikepdf
      - name: Fix the eight PDFs
        run: |
          for f in 30-Days-at-the-Pond Affirmation-Cards Habit-Stacking-Cards Hoppy-Thoughts-Issue-01 Hoppy-Thoughts-Issue-02 Lily-Pad-Planner The-Pocket-Pond Translation-Cards; do
            python3 -I automation/pdf/fix-letter-pdfs.py "digital/$f.pdf" "/tmp/$f.pdf"
            if [ -f "/tmp/$f.pdf" ]; then mv "/tmp/$f.pdf" "digital/$f.pdf"; fi
            pdfinfo "digital/$f.pdf" | grep -E "Pages|Page size"
          done
      - name: Rebuild the Organisation Pack
        run: python3 automation/pdf/organisation-pack.py
      - name: Commit
        run: |
          git config user.name "frog-logic-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digital/*.pdf
          git status --short
          git commit -m "Eight printables: A4 pages, emoji back on their lines; Organisation Pack rebuilt [skip netlify]" || echo "nothing to commit"
          git pull --rebase origin main
          git push
