name: Move the mugs to the UK maker
# Safe to run as often as you like. It never deletes anything, and a mug it
# built on a previous run is CORRECTED in place rather than built again, so a
# second run leaves eight mugs, not sixteen.
#
# The mugs were made in Czechia: £5.76 to produce, £7.79 to post the first one
# to a UK address. The maker sweep on 26 Aug 2026 found the same plain white
# 11oz mug from T Shirt and Sons in the UK at £5.23 with £3.79 postage — less to
# make and four pounds less to post — and they already make the totes, so the
# two now share a parcel.
#
# The first run placed the artwork at scale 1 and it ran off the edges of the
# mug. scale is a fraction of the print area's WIDTH, and a mug's print area is
# much wider than it is tall, so a square design at 1 overflows top and bottom.
# The script now reads the real print area from Printify and fits the artwork to
# it, the same way the tees and totes were always done.
#
# Run with dry_run first. That prints the print area, the scale it works out and
# what it would do to each mug, and changes nothing. Nothing in the shop changes
# either way: the site keeps pointing at the old mugs until the catalogue is
# rebuilt.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report the print area and scale, change nothing"
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  mugs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the mugs on the UK maker
        working-directory: automation/social
        run: node printify-mugs.js
        env:
          PRINTIFY_API_KEY: ${{ secrets.PRINTIFY_API_KEY }}
          PRINTIFY_SHOP_ID: ${{ secrets.PRINTIFY_SHOP_ID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
      - name: Commit the result file
        if: always()
        run: |
          git config user.name "frog-logic-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/social/printify-mugs-result.json || true
          git status --short
          git commit -m "Mugs moved to the UK maker [skip netlify]" || echo "nothing to commit"
          git pull --rebase origin main
          git push
