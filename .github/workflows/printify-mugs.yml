name: Move the mugs to the UK maker
# A one-shot, but a re-runnable one: it creates NEW products and never deletes
# the old ones, so a second run just makes a second set rather than breaking
# anything. Delete the extras in Printify if that happens.
#
# The mugs were made in Czechia: £5.76 to produce, £7.79 to post the first one
# to a UK address. The maker sweep on 26 Aug 2026 found the same plain white
# 11oz mug from T Shirt and Sons in the UK at £5.23 with £3.79 postage — less to
# make and four pounds less to post — and they already make the totes, so the
# two now share a parcel.
#
# Run with dry_run first. That builds ONE mug, reads its real base cost off
# Printify, deletes it again and stops. Nothing in the shop changes either way:
# the site keeps pointing at the old mugs until the catalogue is rebuilt.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build one sample, read its cost, delete it, stop"
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  mugs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the mugs on the UK maker
        working-directory: automation/social
        run: node printify-mugs.js
        env:
          PRINTIFY_API_KEY: ${{ secrets.PRINTIFY_API_KEY }}
          PRINTIFY_SHOP_ID: ${{ secrets.PRINTIFY_SHOP_ID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
      - name: Commit the result file
        if: always()
        run: |
          git config user.name "frog-logic-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/social/printify-mugs-result.json || true
          git status --short
          git commit -m "Mugs moved to the UK maker [skip netlify]" || echo "nothing to commit"
          git pull --rebase origin main
          git push
