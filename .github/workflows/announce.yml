name: One-off announcement post
# Manual only. Renders the card described in automation/social/announce.json,
# commits the image so Instagram can fetch it, then posts to both accounts.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install renderer
        working-directory: automation/social
        run: npm install --no-audit --no-fund
      - name: Install Chromium for rendering
        working-directory: automation/social
        run: npx playwright install --with-deps chromium
      - name: Render the card
        working-directory: automation/social
        run: node announce.js generate
      - name: Commit the image
        run: |
          git config user.name "frog-logic-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/social/queue
          git commit -m "Announcement image [skip netlify]" || echo "nothing to commit"
          git pull --rebase origin main
          git push
      - name: Post to Facebook and Instagram
        working-directory: automation/social
        run: node announce.js post
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
