name: Repair duplicated index.html
# One-shot. An edit made through GitHub's web editor appended a second complete
# copy of the page instead of replacing the first — the editor virtualises long
# files, so a select-all only covered the rendered lines. This truncates the
# file after the first </html>.
#
# It refuses to touch anything unless the file really does contain two
# documents and the surviving copy has both script tags, so it cannot make
# things worse. Safe to delete once run.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Truncate after the first document
        run: |
          node -e '
            const fs = require("fs");
            const f = "index.html";
            const t = fs.readFileSync(f, "utf8");
            const doctypes = (t.match(/<!DOCTYPE/gi) || []).length;
            if (doctypes === 1) { console.log("already a single document — nothing to do"); process.exit(0); }
            if (doctypes !== 2) throw new Error("expected 1 or 2 documents, found " + doctypes);
            const end = t.indexOf("</html>");
            if (end === -1) throw new Error("no closing html tag");
            const first = t.slice(0, end + 7) + "\n";
            if (!first.includes("<script src=\"script.js\"></script>")) throw new Error("surviving copy lost script.js");
            if (!first.includes("<script src=\"size-guide.js\"></script>")) throw new Error("surviving copy lost size-guide.js");
            fs.writeFileSync(f, first);
            console.log("repaired:", t.length, "->", first.length, "bytes");
          '
      - name: Commit
        run: |
          git config user.name "frog-logic-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git status --short
          git commit -m "Repair duplicated index.html [skip netlify]" || echo "nothing to commit"
          git pull --rebase origin main
          git push
