name: Preview a tee-worn-by-people video
# Makes one of the Saturday "tee worn by people" Reels and saves it to
# automation/social/promo/worn-preview.mp4 WITHOUT posting it anywhere.
on:
  workflow_dispatch:
    inputs:
      n:
        description: "Which Saturday in the rotation (0 = the first, 14 Nov)"
        default: "0"
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install video tools
        run: |
          python3 -c "import PIL" 2>/dev/null || pip install --quiet --break-system-packages pillow || pip install --quiet pillow
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Make the video
        working-directory: automation/social
        run: |
          [ -f package.json ] && npm install --no-audit --no-fund --silent || true
          N="${{ inputs.n }}" node worn-preview.js
      - name: Save it
        run: |
          git config user.name "frog-logic-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/social/promo/worn-preview.mp4
          git commit -m "Worn tee preview video [skip netlify]" || echo "nothing to commit"
          git pull --rebase origin main
          git push
