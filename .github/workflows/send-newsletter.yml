name: Send monthly newsletter
on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Write this month's newsletter (skips if marked handwritten)
        run: node automation/social/generate-newsletter.js
      - name: Commit the issue that went out
        run: |
          git config user.name "frog-logic-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/newsletter.json
          git commit -m "Newsletter issue $(date -u +%Y-%m) [skip netlify]" || echo "nothing to commit"
          git pull --rebase origin main
          git push
      - name: Send newsletter
        working-directory: automation/newsletter
        run: node send-newsletter.js
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          SUBSCRIBERS_CSV_URL: ${{ secrets.SUBSCRIBERS_CSV_URL }}
          # Planner customers who ticked the newsletter opt-in join the same send.
          PLANNER_CSV_URL: ${{ secrets.PLANNER_CSV_URL }}
