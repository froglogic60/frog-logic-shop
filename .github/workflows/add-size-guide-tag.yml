name: Add the size-guide script tag to index.html
# One-shot. Inserts <script src="size-guide.js"></script> after the existing
# script.js tag, so the apparel size guides actually load.
#
# Done in CI because GitHub's web editor virtualises long files: a select-all
# only ever covers the lines currently rendered, so replacing a file through it
# silently duplicates the tail instead of overwriting. Safe to delete once run.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert the tag
        run: |
          node -e '
            const fs = require("fs");
            const f = "index.html";
            let t = fs.readFileSync(f, "utf8");
            const tag = "<script src=\"script.js\"></script>";
            const add = "<script src=\"size-guide.js\"></script>";
            if (t.includes(add)) { console.log("already present — nothing to do"); process.exit(0); }
            if (!t.includes(tag)) throw new Error("could not find the script.js tag to anchor to");
            if (!fs.existsSync("size-guide.js")) throw new Error("size-guide.js is not in the repo");
            t = t.replace(tag, tag + "\n" + add);
            fs.writeFileSync(f, t);
            console.log("inserted; index.html is now", fs.statSync(f).size, "bytes");
          '
      - name: Commit
        run: |
          git config user.name "frog-logic-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git status --short
          git commit -m "Load the apparel size guides [skip netlify]" || echo "nothing to commit"
          git pull --rebase origin main
          git push
