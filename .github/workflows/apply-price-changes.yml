name: Apply price changes to script.js
# One-shot. Runs automation/social/apply-price-changes.js, which rewrites
# script.js in place: hoodies to £36.99, and the seven pins become £3.50
# stickers because Printify has no UK or EU maker for pins.
#
# Done in CI rather than by hand because script.js is 141KB and GitHub's web
# editor silently refuses a paste that size. The script asserts its own result
# and throws rather than leaving the file half-edited, so a failed run commits
# nothing. Safe to delete once it has been run.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rewrite script.js
        run: node automation/social/apply-price-changes.js
      - name: Check it still parses
        run: node -e "require('./automation/social/lib.js').loadSiteData(); console.log('script.js parses')"
      - name: Commit
        run: |
          git config user.name "frog-logic-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          git status --short
          git commit -m "Hoodies to £36.99; pins become stickers [skip netlify]" || echo "nothing to commit"
          git pull --rebase origin main
          git push
