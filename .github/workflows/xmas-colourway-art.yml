name: Christmas colourway artwork
# Draws the bright and black-and-white Socially Hibernating artwork
# (artwork/frogs/src/socially-hibernating-colourways.py) and commits the PNGs
# to artwork/frogs/ [skip netlify], where Printify fetches them from.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libcairo2
      - run: pip install cairosvg pillow
      - name: Fonts
        run: node -e 'require("./automation/social/gfonts.js").ensureFonts("automation/social/.gfonts").then(()=>console.log("fonts ok"))'
      - name: Draw
        run: python artwork/frogs/src/socially-hibernating-colourways.py automation/social/.gfonts
      - name: Commit
        run: |
          git config user.name "frog-logic-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artwork/frogs/socially-hibernating-bright*.png artwork/frogs/socially-hibernating-mono*.png
          git commit -m "Christmas colourway artwork [skip netlify]" || echo "nothing to commit"
          git pull --rebase origin main
          git push
