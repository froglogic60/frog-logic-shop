name: Move the stickers to 3 inch
# One-shot. Safe to delete once it has run and the result looks right.
#
# The 4" sticker costs £5.46 and sells for £3.50 — the only product in the shop
# that loses money by being bought. The 3" off the same blueprint, same maker,
# same artwork, costs £2.79.
#
# Run it once with apply = "no" and read the log before running it with "yes".
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Actually change the products? Leave as "no" for a dry run first.'
        default: "no"
        type: choice
        options: ["no", "yes"]
permissions:
  contents: write
jobs:
  resize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Move them
        working-directory: automation/social
        run: node resize-stickers.js
        env:
          APPLY: ${{ inputs.apply == 'yes' && '1' || '' }}
          PRINTIFY_API_KEY: ${{ secrets.PRINTIFY_API_KEY }}
          PRINTIFY_SHOP_ID: ${{ secrets.PRINTIFY_SHOP_ID }}
      - name: Check the catalogue agrees
        if: ${{ inputs.apply == 'yes' }}
        run: |
          node -e '
            const cat = require("./netlify/functions/catalog.json");
            const stuck = cat.filter((x) => x.printifyVariantId === 92315);
            const moved = cat.filter((x) => x.printifyVariantId === 92314);
            console.log(moved.length, "on the 3\" variant;", stuck.length, "still on 4\"");
            if (stuck.length) throw new Error("still on the 4\" variant: " + stuck.map((x) => x.id).join(", "));
            if (!moved.length) throw new Error("nothing ended up on the 3\" variant");
            for (const s of moved) console.log(" ", s.id, "£" + s.price.toFixed(2), "- cost £2.79 =", "£" + (s.price - 2.79).toFixed(2), "before postage");
          '
      - name: Commit
        if: ${{ inputs.apply == 'yes' }}
        run: |
          git config user.name "frog-logic-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add netlify/functions/catalog.json
          git status --short
          git commit -m "Move the stickers onto the 3 inch variant [skip netlify]" || echo "nothing to commit"
          git pull --rebase origin main
          git push
