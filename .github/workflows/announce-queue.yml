name: Scheduled announcement queue
# Checks automation/social/announce-queue.json once a day at 10:13 UTC (moved off
# the hour 2 Nov 2026: GitHub runs on-the-hour jobs hours late),
# sitting between the 08/12/17 UTC daily posts. If an entry's date has arrived and
# it hasn't gone out yet, it is rendered, committed and posted, then marked done.
# Nothing due = the job exits in seconds without installing anything.
on:
  schedule:
    # 3 Nov 2026: several early schedules, and wait-slot.cjs holds the run
    # until 11am UK time (GitHub starts jobs hours late). The first run to
    # start posts; the others find nothing left due.
    - cron: "53 5 * * *"
    - cron: "23 7 * * *"
    - cron: "53 8 * * *"
    - cron: "13 10 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: announce-queue
  cancel-in-progress: false
jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wait until 11:00 UK time
        id: wait
        run: node automation/social/wait-slot.cjs 11:00 21:30
      - name: Is anything due today?
        id: check
        if: steps.wait.outputs.go == 'yes'
        run: |
          git pull --ff-only origin main
          node -e '
            const fs = require("fs");
            const f = "automation/social/announce-queue.json";
            const q = fs.existsSync(f) ? JSON.parse(fs.readFileSync(f, "utf8")) : [];
            const now = new Date().toISOString().slice(0, 10);
            const e = q.find((x) => !x.posted && x.postOn <= now);
            console.log(e ? `Due: ${e.title}` : `Nothing due on ${now}.`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `due=${e ? "yes" : "no"}\n`);
          '
      - name: Install renderer
        if: steps.check.outputs.due == 'yes'
        working-directory: automation/social
        run: npm install --no-audit --no-fund
      - name: Install Chromium for rendering
        if: steps.check.outputs.due == 'yes'
        working-directory: automation/social
        run: npx playwright install --with-deps chromium
      - name: Render the card
        if: steps.check.outputs.due == 'yes'
        working-directory: automation/social
        run: node announce.js due-generate
      - name: Commit the image
        if: steps.check.outputs.due == 'yes'
        run: |
          git config user.name "frog-logic-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/social/queue
          git commit -m "Queued announcement image [skip netlify]" || echo "nothing to commit"
          git pull --rebase origin main
          git push
      - name: Post to Facebook and Instagram
        if: steps.check.outputs.due == 'yes'
        working-directory: automation/social
        run: node announce.js due-post
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
      - name: Mark it posted
        if: steps.check.outputs.due == 'yes'
        run: |
          git add automation/social/announce-queue.json
          git commit -m "Queue entry posted [skip netlify]" || echo "nothing to commit"
          git pull --rebase origin main
          git push
