name: Add the printable sticker sheet
# One-shot. Safe to delete after it has run once.
#
# Printed stickers are the one thing print-on-demand is genuinely bad at:
# £5.46 to make one and £6.49 to post the first, against a £3.50 price. The
# same eighteen designs sold as a printable sheet cost nothing to make, nothing
# to post, and arrive in a minute.
#
# Three steps, in this order on purpose:
#   1. read the artwork out of script.js into a content file
#   2. render the PDF, so the download exists
#   3. only then put the product on the shop — add-sticker-sheet.js refuses if
#      the PDF is missing, because a listed product with no file is a paying
#      customer looking at a 404
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stickers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install WeasyPrint and its text-shaping libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 libcairo2 libgdk-pixbuf-2.0-0 poppler-utils
          pip install --quiet weasyprint
      - name: Collect the sticker artwork
        run: node automation/pdf/sticker-sheet.js
      - name: Render the sheet
        run: python3 automation/pdf/build.py frog-logic-stickers
      - name: Put it on the shop
        run: node automation/pdf/add-sticker-sheet.js
      - name: Check the shop and the checkout agree
        run: |
          node -e '
            const fs = require("fs");
            const cat = JSON.parse(fs.readFileSync("netlify/functions/catalog.json", "utf8"));
            const e = cat.find((x) => x.id === "d31-frog-logic-stickers");
            if (!e) throw new Error("no catalogue entry");
            if (!fs.existsSync("digital/" + e.file)) throw new Error("no PDF at digital/" + e.file);
            const bytes = fs.statSync("digital/" + e.file).size;
            console.log(e.name, "£" + e.price.toFixed(2), "->", e.file, bytes, "bytes");
            if (bytes < 20000) throw new Error("that PDF looks too small to be right");
            console.log(cat.filter((x) => x.type === "digital").length, "digital products in the catalogue");
          '
      - name: Commit
        run: |
          git config user.name "frog-logic-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js netlify/functions/catalog.json digital automation/pdf/products
          git status --short
          git commit -m "Add Frog Logic Stickers, the printable sheet" || echo "nothing to commit"
          git pull --rebase origin main
          git push
