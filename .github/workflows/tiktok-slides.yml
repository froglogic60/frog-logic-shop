name: TikTok slides
# Renders every set in automation/social/tiktok-sets.json to
# automation/social/tiktok/<set>/ and commits the images. Run by hand from
# the Actions tab whenever a set is added or changed. Never deploys.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install renderer
        working-directory: automation/social
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        working-directory: automation/social
        run: npx playwright install --with-deps chromium
      - name: Render slides
        working-directory: automation/social
        run: node tiktok-slides.js
      - name: Zip everything for download
        working-directory: automation/social
        run: rm -f tiktok.zip && zip -qr tiktok.zip tiktok sam-posts.md group-posts.md
      - name: Commit the images
        run: |
          git config user.name "frog-logic-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/social/tiktok automation/social/tiktok.zip
          git commit -m "TikTok slides rendered [skip netlify]" || echo "nothing to commit"
          git pull --rebase origin main
          git push
