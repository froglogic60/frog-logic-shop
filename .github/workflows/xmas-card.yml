name: Build the Christmas relatives card
# Renders automation/social/xmas/xmas-relatives-card.jpg (xmas-card.cjs), the
# "send this to the relatives" picture (28 Oct 2026). Run by hand.
# Commits [skip netlify]: the posts take the images from raw.githubusercontent.com.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install renderer
        working-directory: automation/social
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        working-directory: automation/social
        run: npx playwright install --with-deps chromium
      - name: Build the cards
        working-directory: automation/social
        run: node xmas-card.cjs
      - name: Commit
        run: |
          git config user.name "frog-logic-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/social/xmas/xmas-relatives-card.jpg
          git commit -m "Christmas relatives card built [skip netlify]" || echo "nothing to commit"
          git pull --rebase origin main
          git push
