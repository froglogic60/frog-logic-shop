name: Tidy up the leftovers
# One-shot. Delete this file once it has run.
#
# Two kinds of dead weight, removed in one commit.
#
# Nested copies of folders inside themselves, from early mistakes:
#
#   frog-logic-shop/          the whole repo inside the repo
#   automation/social/social/ the social scripts inside the social scripts
#
# Neither is just clutter. The first carries its own netlify/functions/
# create-checkout.js and catalog.json; the second carries its own daily.js,
# lib.js and generate-newsletter.js, several of which now DIFFER from the real
# ones. Nothing builds from either, but the next person to search this repo for
# "create-checkout" or "daily.js" finds two files and no way to tell which one
# is live — and the stale one looks perfectly plausible.
#
# And the one-shot scripts that have already run: renaming Show These Cards to
# When Words Go, and listing the printable sticker sheet. Both did their job
# once and would do nothing now.
#
# The matching .github/workflows/*.yml files cannot be deleted from here: a
# workflow run's token is not allowed to change workflow files. Those go by hand.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check nothing still refers to any of it
        # Deleting a file something imports is a broken build at the worst
        # moment. This looks for references OUTSIDE the paths being removed.
        # The repo's own name appears in raw.githubusercontent.com URLs all over
        # automation/, which is not a reference to the nested folder, so those
        # lines are filtered out rather than counted as a reason to stop.
        run: |
          set -e
          BAD=0
          for name in "rename-when-words-go" "add-sticker-sheet"; do
            HITS=$(grep -rl "$name" --exclude-dir=.git --exclude-dir=node_modules . \
              | grep -v "automation/social/$name.js" \
              | grep -v "automation/pdf/$name.js" \
              | grep -v ".github/workflows/$name.yml" \
              | grep -v ".github/workflows/tidy-up.yml" || true)
            if [ -n "$HITS" ]; then echo "! $name is still referenced by:"; echo "$HITS"; BAD=1; fi
          done
          HITS=$(grep -rn "frog-logic-shop/" --exclude-dir=.git --exclude-dir=node_modules \
            --exclude-dir=frog-logic-shop . \
            | grep -v "githubusercontent.com" | grep -v "github.com" \
            | grep -v ".github/workflows/tidy-up.yml" || true)
          if [ -n "$HITS" ]; then echo "! the nested repo folder is referenced by:"; echo "$HITS"; BAD=1; fi
          HITS=$(grep -rn "social/social\|post-social" --exclude-dir=.git --exclude-dir=node_modules \
            --exclude-dir=social . \
            | grep -v ".github/workflows/tidy-up.yml" \
            | grep -v "FROG-LOGIC-CONTEXT.md" || true)
          if [ -n "$HITS" ]; then echo "! the nested social folder is referenced by:"; echo "$HITS"; BAD=1; fi
          if [ "$BAD" = "1" ]; then echo "REFUSING — something still points at these."; exit 1; fi
          echo "nothing refers to any of it"
      - name: Remove
        run: |
          git rm -r --quiet --ignore-unmatch frog-logic-shop
          git rm -r --quiet --ignore-unmatch automation/social/social
          git rm --quiet --ignore-unmatch automation/social/rename-when-words-go.js
          git rm --quiet --ignore-unmatch automation/pdf/add-sticker-sheet.js
          git status --short
      - name: Check the shop is still whole
        # The nested copies shared filenames with the real ones. If a delete took
        # a real file with it, this is where it shows up.
        run: |
          node -e '
            const fs = require("fs");
            const must = [
              "script.js", "basket.js", "size-guide.js", "index.html",
              "netlify/functions/create-checkout.js",
              "netlify/functions/quote.js",
              "netlify/functions/stripe-webhook.js",
              "netlify/functions/catalog.json",
              "netlify/functions/shipping-zones.json",
              "automation/pdf/build.py",
              "automation/pdf/sticker-sheet.js",
              "automation/social/lib.js",
              "automation/social/daily.js",
              "automation/social/generate-newsletter.js",
              "automation/social/printify-setup.js",
              "automation/social/shipping-rates.js",
            ];
            const gone = must.filter((f) => !fs.existsSync(f));
            if (gone.length) throw new Error("MISSING: " + gone.join(", "));
            const cat = JSON.parse(fs.readFileSync("netlify/functions/catalog.json", "utf8"));
            console.log(cat.length, "products;", cat.filter((x) => x.type === "digital").length, "digital");
            if (cat.length < 120) throw new Error("catalogue looks truncated");
            console.log("all", must.length, "key files present");
          '
      - name: Commit
        run: |
          git config user.name "frog-logic-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove the nested copies and the spent one-shots [skip netlify]" || echo "nothing to commit"
          git pull --rebase origin main
          git push
