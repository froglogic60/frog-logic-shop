name: Check whether the API can choose Etsy mockups
# Read-only test: reads one hand-fixed tee, tries choosing mockups on a
# throwaway copy that is never published, then deletes it. Nothing reaches Etsy.
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Probe
        working-directory: automation/social
        run: node mockup-probe.js
        env:
          PRINTIFY_API_KEY: ${{ secrets.PRINTIFY_API_KEY }}
