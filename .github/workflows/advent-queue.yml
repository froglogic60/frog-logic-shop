name: Pond Advent daily video
# Added 27 Nov 2026 (Sam's yes). One Pond Advent door video a day, 1-24 Dec,
# to Instagram (Reel) and the Facebook Page, from automation/social/advent-queue.json.
# Its own queue and slot (10:00 UK) so it never clashes with announce-queue (11:00),
# daily-social (13:00) or the Sunday SBS posts. Early schedules + wait-slot.cjs as
# in the other posting workflows; a run that starts after 21:30 posts nothing.
on:
  schedule:
    - cron: "53 4 * * *"
    - cron: "53 5 * * *"
    - cron: "23 7 * * *"
    - cron: "53 8 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: advent-queue
  cancel-in-progress: false
jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wait until 10:00 UK time
        id: wait
        run: node automation/social/wait-slot.cjs 10:00 21:30
      - name: Is anything due today?
        id: check
        if: steps.wait.outputs.go == 'yes'
        run: |
          git pull --ff-only origin main
          node -e '
            const fs = require("fs");
            const f = "automation/social/advent-queue.json";
            const q = fs.existsSync(f) ? JSON.parse(fs.readFileSync(f, "utf8")) : [];
            const now = new Date().toISOString().slice(0, 10);
            const e = q.find((x) => !x.posted && x.postOn <= now);
            console.log(e ? `Due: ${e.title}` : `Nothing due on ${now}.`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `due=${e ? "yes" : "no"}\n`);
          '
      - name: Install renderer
        if: steps.check.outputs.due == 'yes'
        working-directory: automation/social
        run: npm install --no-audit --no-fund
      - name: Install Chromium for rendering
        if: steps.check.outputs.due == 'yes'
        working-directory: automation/social
        run: npx playwright install --with-deps chromium
      - name: Install video tools (Reels, 7 Nov 2026)
        if: steps.check.outputs.due == 'yes'
        run: |
          python3 -c "import PIL" 2>/dev/null || pip install --quiet --break-system-packages pillow || pip install --quiet pillow
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Render the card
        if: steps.check.outputs.due == 'yes'
        working-directory: automation/social
        run: QUEUE_FILE=advent-queue.json node announce.js due-generate
      - name: Commit the image
        if: steps.check.outputs.due == 'yes'
        run: |
          git config user.name "frog-logic-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/social/queue
          git commit -m "Queued announcement image [skip netlify]" || echo "nothing to commit"
          git pull --rebase origin main
          git push
      - name: Post to Facebook and Instagram
        if: steps.check.outputs.due == 'yes'
        working-directory: automation/social
        run: QUEUE_FILE=advent-queue.json COMMIT_SHA=$(git rev-parse HEAD) node announce.js due-post
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
      - name: Mark it posted
        if: steps.check.outputs.due == 'yes'
        run: |
          git add automation/social/advent-queue.json
          git commit -m "Advent queue entry posted [skip netlify]" || echo "nothing to commit"
          git pull --rebase origin main
          git push
