name: Find a cheaper sticker maker
# Not a one-shot — worth re-running whenever Printify changes its prices.
#
# Ten stickers are on sale at £3.50 against a £5.46 base cost, losing £1.96 a
# sale before postage. This finds out whether a cheaper UK or EU maker exists.
#
# Printify does not expose base cost in its catalogue, only postage, so the
# script builds a throwaway product per candidate maker, reads the real cost off
# it, and deletes it again. It never touches catalog.json or any real product,
# and anything it fails to delete is listed at the end of the log.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "How many makers to sample (each one builds and deletes a product)"
        default: "10"
      keep:
        description: "Leave the sample products behind for inspection"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  stickers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sample the sticker makers
        working-directory: automation/social
        run: node sticker-makers.js
        env:
          PRINTIFY_API_KEY: ${{ secrets.PRINTIFY_API_KEY }}
          PRINTIFY_SHOP_ID: ${{ secrets.PRINTIFY_SHOP_ID }}
          LIMIT: ${{ inputs.limit }}
          KEEP: ${{ inputs.keep && '1' || '' }}
      - name: Commit the report
        if: always()
        run: |
          git config user.name "frog-logic-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/social/sticker-maker-report.json || true
          git status --short
          git commit -m "Sticker maker cost report [skip netlify]" || echo "nothing to commit"
          git pull --rebase origin main
          git push
