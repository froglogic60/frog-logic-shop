name: Find a cheaper maker
# Not a one-shot — worth re-running whenever Printify changes its prices.
#
# Pick the product with the "kind" input. It answers one question: is there a
# cheaper or closer maker than the one in use? It was written for the stickers
# (£3.50 against a £5.46 cost), then covered the mugs, where the problem was
# postage rather than cost — £7.79 to send a £14 mug to a UK address, because
# the maker was in the EU. That one worked: the mugs moved to a UK maker,
# cheaper to make AND four pounds cheaper to post, with no price change.
#
# It now also covers the wall prints, which are the worst position in the shop:
# £12 a print against a £12.72 cost, so every sale loses 72p, and £5.29 postage
# on top. Found by the margin check on 27 Aug 2026.
#
# Printify does not expose base cost in its catalogue, only postage, so the
# script builds a throwaway product per candidate maker, reads the real cost off
# it, and deletes it again. It never touches catalog.json or any real product,
# and anything it fails to delete is listed at the end of the log.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: "Which product to sample"
        type: choice
        options: ["print", "mug", "sticker"]
        default: "print"
      limit:
        description: "How many makers to sample (each one builds and deletes a product)"
        default: "10"
      keep:
        description: "Leave the sample products behind for inspection"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  makers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sample the makers
        working-directory: automation/social
        run: node sticker-makers.js
        env:
          PRINTIFY_API_KEY: ${{ secrets.PRINTIFY_API_KEY }}
          PRINTIFY_SHOP_ID: ${{ secrets.PRINTIFY_SHOP_ID }}
          KIND: ${{ inputs.kind }}
          LIMIT: ${{ inputs.limit }}
          KEEP: ${{ inputs.keep && '1' || '' }}
      - name: Commit the report
        if: always()
        run: |
          git config user.name "frog-logic-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Every report, not a hardcoded list. Adding a new kind to the KINDS map
          # in sticker-makers.js used to silently produce a report the runner then
          # threw away, because its filename was not named here.
          git add "automation/social/"*-maker-report.json || true
          git status --short
          git commit -m "Maker cost report [skip netlify]" || echo "nothing to commit"
          git pull --rebase origin main
          git push
