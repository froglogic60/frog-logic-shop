name: Match Printify US prices to Etsy
# One-off (15 Oct 2026): US postage on Etsy was moved into the item price, so
# Printify's prices for the US mugs, prints and candle are raised to match.
# Printify only — nothing is published to Etsy. See us-price-sync.js.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report only, change nothing"
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Match prices
        working-directory: automation/social
        run: node us-price-sync.js
        env:
          PRINTIFY_API_KEY: ${{ secrets.PRINTIFY_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
      - name: Commit the report
        if: ${{ always() && !inputs.dry_run }}
        run: |
          git config user.name "frog-logic-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/social/us-price-sync-report.json
          git commit -m "US price sync report [skip netlify]" || echo "nothing to commit"
          git pull --rebase origin main
          git push
