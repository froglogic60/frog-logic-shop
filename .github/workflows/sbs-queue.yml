name: Small Business Sunday queue
# Added 18 Nov 2026. Theo Paphitis's #SBS only counts posts made on a Sunday
# between 5pm and 7:30pm UK time, so these entries live in their own queue
# (automation/social/sbs-queue.json) instead of announce-queue.json, which posts
# at 11am. Same steps as the announcement queue; the runs start early on
# Sundays (GitHub starts scheduled jobs late) and wait-slot.cjs holds them until
# 17:05 UK time. A run that starts after 19:15 posts nothing.
on:
  schedule:
    - cron: "53 11 * * 0"
    - cron: "53 12 * * 0"
    - cron: "23 13 * * 0"
    - cron: "53 14 * * 0"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sbs-queue
  cancel-in-progress: false
jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wait until 17:05 UK time
        id: wait
        run: node automation/social/wait-slot.cjs 17:05 19:15
      - name: Is anything due today?
        id: check
        if: steps.wait.outputs.go == 'yes'
        run: |
          git pull --ff-only origin main
          node -e '
            const fs = require("fs");
            const f = "automation/social/sbs-queue.json";
            const q = fs.existsSync(f) ? JSON.parse(fs.readFileSync(f, "utf8")) : [];
            const now = new Date().toISOString().slice(0, 10);
            const e = q.find((x) => !x.posted && x.postOn <= now);
            console.log(e ? `Due: ${e.title}` : `Nothing due on ${now}.`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `due=${e ? "yes" : "no"}\n`);
          '
      - name: Install renderer
        if: steps.check.outputs.due == 'yes'
        working-directory: automation/social
        run: npm install --no-audit --no-fund
      - name: Install Chromium for rendering
        if: steps.check.outputs.due == 'yes'
        working-directory: automation/social
        run: npx playwright install --with-deps chromium
      - name: Install video tools (Reels, 7 Nov 2026)
        if: steps.check.outputs.due == 'yes'
        run: |
          python3 -c "import PIL" 2>/dev/null || pip install --quiet --break-system-packages pillow || pip install --quiet pillow
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Render the card
        if: steps.check.outputs.due == 'yes'
        working-directory: automation/social
        run: QUEUE_FILE=sbs-queue.json node announce.js due-generate
      - name: Commit the image
        if: steps.check.outputs.due == 'yes'
        run: |
          git config user.name "frog-logic-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/social/queue
          git commit -m "Queued announcement image [skip netlify]" || echo "nothing to commit"
          git pull --rebase origin main
          git push
      - name: Post to Facebook and Instagram
        if: steps.check.outputs.due == 'yes'
        working-directory: automation/social
        run: QUEUE_FILE=sbs-queue.json COMMIT_SHA=$(git rev-parse HEAD) node announce.js due-post
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
      - name: Mark it posted
        if: steps.check.outputs.due == 'yes'
        run: |
          git add automation/social/sbs-queue.json
          git commit -m "SBS queue entry posted [skip netlify]" || echo "nothing to commit"
          git pull --rebase origin main
          git push
