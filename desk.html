<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The Desk — Frog Logic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=DM+Sans:wght@400;500;700&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#F4EFE3; --ink:#2A2620; --muted:#8A7F6E; --line:#DDD3C2;
         --gold:#B08A2E; --pond:#2E6B4A; --you:#A9491C; --card:#FDFBF6; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--paper); color:var(--ink);
        font-family:'DM Sans',sans-serif; font-size:16px; line-height:1.5; }
  .wrap{ max-width:760px; margin:0 auto; padding:40px 20px 80px; }
  h1{ font-family:Fraunces,serif; font-weight:600; font-size:2.2rem; margin:0 0 4px; }
  .sub{ color:var(--muted); margin:0 0 34px; font-size:.95rem; }
  h2{ font-family:Fraunces,serif; font-weight:600; font-size:1.25rem; margin:38px 0 12px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:8px; padding:4px 18px; }
  .row{ display:flex; gap:14px; padding:11px 0; border-bottom:1px solid var(--line); align-items:baseline; }
  .row:last-child{ border-bottom:none; }
  .when{ font-family:'Space Mono',monospace; font-size:.78rem; color:var(--muted);
         min-width:108px; flex-shrink:0; letter-spacing:.02em; }
  .what{ flex:1; }
  .tag{ font-family:'Space Mono',monospace; font-size:.68rem; letter-spacing:.08em;
        padding:2px 8px; border-radius:99px; white-space:nowrap; align-self:center; }
  .tag.robot{ background:#E4EFE8; color:var(--pond); }
  .tag.you{ background:#F6E3D7; color:var(--you); }
  .tag.note{ background:#F1E7CB; color:#7A5E10; }
  .today{ outline:2px solid var(--gold); outline-offset:-2px; }
  .today .dayhead{ color:var(--gold); }
  .dayblock{ margin-bottom:14px; }
  .dayhead{ font-family:'Space Mono',monospace; font-size:.8rem; letter-spacing:.14em;
            text-transform:uppercase; color:var(--muted); margin:0 0 6px 2px; }
  ul.whenever{ margin:0; padding:0 0 0 2px; list-style:none; }
  ul.whenever li{ padding:10px 0 10px 26px; border-bottom:1px solid var(--line); position:relative; }
  ul.whenever li:last-child{ border-bottom:none; }
  ul.whenever li::before{ content:""; position:absolute; left:2px; top:16px; width:12px; height:12px;
        border:2px solid var(--you); border-radius:3px; }
  .quiet{ color:var(--muted); font-size:.9rem; }
  .foot{ margin-top:46px; color:var(--muted); font-size:.82rem; font-family:'Space Mono',monospace; }
  a{ color:var(--pond); }
  @media (max-width:520px){ .when{ min-width:84px; font-size:.72rem; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>The Desk</h1>
  <p class="sub">What the shop is doing, what's coming, and the short list that needs your hands. Green means a robot does it; rust means you. Not linked from the shop — this page is yours.</p>

  <h2>Every day, without you</h2>
  <div class="card" id="standing"></div>

  <h2>Coming up</h2>
  <div id="agenda"><p class="quiet">Loading the calendar…</p></div>

  <h2>Whenever you have the spoons</h2>
  <div class="card"><ul class="whenever" id="whenever"></ul></div>

  <p class="foot" id="stamp"></p>
</div>
<script>
const RAW = "https://raw.githubusercontent.com/froglogic60/frog-logic-shop/main/";
const fmt = (iso) => new Date(iso + "T12:00:00Z").toLocaleDateString("en-GB",
  { weekday: "long", day: "numeric", month: "long" });
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]));
const tagFor = (who) => `<span class="tag ${who === "you" ? "you" : who === "note" ? "note" : "robot"}">${
  who === "you" ? "YOURS" : who === "note" ? "NOTE" : "AUTOMATIC"}</span>`;

async function load() {
  let cal, queue = [];
  try { cal = await fetch(RAW + "content/calendar.json", { cache: "no-store" }).then(r => r.json()); }
  catch (e) {
    document.getElementById("agenda").innerHTML =
      '<p class="quiet">Couldn’t reach the calendar file — GitHub may be having a moment. Try a refresh.</p>';
    return;
  }
  try { queue = await fetch(RAW + "automation/social/announce-queue.json", { cache: "no-store" }).then(r => r.json()); }
  catch (e) { /* announcements are already mirrored in the calendar; carry on */ }

  document.getElementById("standing").innerHTML = cal.standing.map(s =>
    `<div class="row"><span class="when">${esc(s.time)}</span><span class="what">${esc(s.what)}</span>${tagFor(s.who)}</div>`
  ).join("");

  // Merge: calendar days plus any queued announcement not already mentioned.
  const byDate = new Map(cal.days.map(d => [d.date, [...d.items]]));
  for (const q of queue) {
    if (q.posted) continue;
    const items = byDate.get(q.postOn) || [];
    if (!items.some(i => i.what.toLowerCase().includes((q.title || "").toLowerCase().slice(0, 12)))) {
      items.push({ what: "FB/IG announcement: " + q.title, who: "robot" });
      byDate.set(q.postOn, items);
    }
  }

  const today = new Date().toISOString().slice(0, 10);
  const dates = [...byDate.keys()].filter(d => d >= today).sort();
  document.getElementById("agenda").innerHTML = dates.length ? dates.map(d => `
    <div class="dayblock">
      <p class="dayhead">${d === today ? "Today — " : ""}${fmt(d)}</p>
      <div class="card${d === today ? " today" : ""}">
        ${byDate.get(d).map(i =>
          `<div class="row"><span class="what">${esc(i.what)}</span>${tagFor(i.who)}</div>`).join("")}
      </div>
    </div>`).join("")
    : '<p class="quiet">Nothing dated ahead — the daily routine above still runs.</p>';

  document.getElementById("whenever").innerHTML =
    cal.whenever.map(w => `<li>${esc(w)}</li>`).join("");
  document.getElementById("stamp").textContent =
    "CALENDAR LAST UPDATED " + cal.updated + " · ASK CLAUDE TO CHANGE ANYTHING ON THIS PAGE";
}
load();
</script>
</body>
</html>
