<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- What a link to this page looks like when it is pasted into Facebook,
     Pinterest, Instagram, WhatsApp or a message. Without these a shop link
     renders as a bare grey URL with no picture and no words, which is most
     of the reason to click one. Added 29 Aug 2026 — there had been none. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Frog Logic">
<meta property="og:locale" content="en_GB">
<meta property="og:url" content="https://froglogic.co.uk/thank-you.html">
<meta property="og:title" content="Thank you — Frog Logic">
<meta property="og:description" content="Your Frog Logic order is in. Downloads arrive by email; printed pieces are made to order.">
<meta property="og:image" content="https://froglogic.co.uk/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The Frog Logic frog beside the words: neurodivergent-affirming prints, apparel and printables.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Thank you — Frog Logic">
<meta name="twitter:description" content="Your Frog Logic order is in. Downloads arrive by email; printed pieces are made to order.">
<meta name="twitter:image" content="https://froglogic.co.uk/assets/og-image.png">
</head>
<body>
  <header class="site-header">
    <div class="wrap" style="display:flex; align-items:center; gap:10px;">
      <a href="/" style="display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit;">
        <img src="assets/frog-logic-mark-sm.png" alt="" width="34" height="30">
        <strong>Frog Logic</strong>
      </a>
    </div>
  </header>

  <main class="wrap" style="max-width:640px; padding:80px 24px; text-align:center;">
    <h1>Thank you 🐸</h1>
    <p id="status" style="font-size:1.1em; opacity:.85;">Confirming your order…</p>
    <p style="margin-top:32px;"><a href="/">Back to the collection</a></p>
    <p style="margin-top:24px; font-size:.86em; opacity:.7;">
      <a href="/returns.html">Returns</a> ·
      <a href="/privacy.html">Privacy</a> ·
      <a href="/terms.html">Terms</a>
    </p>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get('session_id');
    const el = document.getElementById('status');
    if (!sessionId) {
      el.textContent = "Something's not quite right — if you were charged and don't hear from us shortly, email hello@froglogic.co.uk.";
    } else {
      el.innerHTML = "Your order's confirmed. Digital pieces arrive by email in a moment; physical pieces ship separately once they're printed. If anything looks off, email <a href=\"mailto:hello@froglogic.co.uk\">hello@froglogic.co.uk</a>.";
    }
  </script>
</body>
</html>
